name: Debug Windows crash
on:
  push:
    branches: ["debug/win-crash"]
  workflow_dispatch:

jobs:
  # Full suite under xdist, as in the real CI job. Not fail-fast: we want to
  # see how many iterations crash.
  full-parallel:
    name: Full suite, xdist loop (windows, py313)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CI: True
      PYTHONFAULTHANDLER: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          environments: py313
      - run: pixi run -e py313 postinstall
      - run: pixi list -e py313
      - name: Loop full suite (xdist)
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 10); do
            echo "=== iteration $i ==="
            pixi run -e py313 python -X faulthandler -m pytest tests/glm \
              --doctest-modules src/glum -nauto -p no:cacheprovider -q || fails=$((fails+1))
          done
          echo "failed iterations: $fails / 10"
          [ "$fails" -eq 0 ]

  # Full suite without xdist: if it crashes, faulthandler shows the main thread.
  full-serial:
    name: Full suite, serial loop (windows, py313)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CI: True
      PYTHONFAULTHANDLER: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          environments: py313
      - run: pixi run -e py313 postinstall
      - name: Loop full suite (serial)
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 4); do
            echo "=== iteration $i ==="
            pixi run -e py313 python -X faulthandler -m pytest tests/glm \
              --doctest-modules src/glum -p no:xdist -p no:cacheprovider -s -v || fails=$((fails+1))
          done
          echo "failed iterations: $fails / 4"
          [ "$fails" -eq 0 ]
