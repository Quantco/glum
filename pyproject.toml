[build-system]
requires = [
  'setuptools',
  'setuptools-scm',
  'wheel',
  'Cython',
  'numpy>=1.25',
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
ignore = ["E731", "N802", "N803", "N806"]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E", "W",
  # isort
  "I",
  # pep8-naming
  "N",
  # pyupgrade
  "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["glum", "glum_benchmarks"]

[tool.mypy]
python_version = '3.11'
exclude = [
  "^tests/",
  "^\\.pixi/",
]
no_implicit_optional = false
check_untyped_defs = true
namespace_packages = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# https://github.com/scikit-learn/scikit-learn/issues/16705
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pytest source uses Python 3.10+ syntax, but we target 3.9
module = ["pytest.*", "_pytest.*"]
follow_imports = "skip"

[tool.cibuildwheel]
build-frontend = "build[uv]"
skip = [
  "*-win32",
  "*-manylinux_i686",
  "*-musllinux_*",
  "*t-*",
]
test-requires = ["pytest", "pytest-xdist"]

[tool.cibuildwheel.macos]
before-all = [
  "micromamba create -y -p \"$MAMBA_ROOT_PREFIX/envs/build\" -c conda-forge 'llvm-openmp=11'",
]

[tool.cibuildwheel.macos.environment]
LDFLAGS="-Wl,-rpath,$MAMBA_ROOT_PREFIX/envs/build/lib -L$MAMBA_ROOT_PREFIX/envs/build/lib"
CFLAGS="-I$MAMBA_ROOT_PREFIX/envs/build/include"
CXXFLAGS="-I$MAMBA_ROOT_PREFIX/envs/build/include"
CXX="/usr/bin/clang++"
CC="/usr/bin/clang"
MACOSX_DEPLOYMENT_TARGET="10.13"


[tool.pytest.ini_options]
addopts = "-s --tb=short"
norecursedirs = ["__pycache__", "build"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
# Filters are standard python warning filters as described here:
# https://docs.python.org/3/library/warnings.html#the-warnings-filter
# The oldies and nightly environments override this with `-W default` (see pixi.toml).
filterwarnings = [
    # Treat any warning as an error by default; add specific `ignore` filters
    # below for unavoidable third-party warnings.
    "error",
    # sklearn's check_estimator warns about checks it skips (e.g. array API checks
    # when SCIPY_ARRAY_API is not set).
    "ignore::sklearn.exceptions.SkipTestWarning",
]
